<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#09090B">
<title>CLERVIO — Hors ligne</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  min-height:100vh;min-height:100svh;padding:32px;
  display:flex;align-items:center;justify-content:center;
  color:#F5F2EB;background:#09090B;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{width:min(100%,360px)}
.mark{
  width:52px;height:52px;margin-bottom:32px;border-radius:16px;
  display:grid;place-items:center;color:#C9A869;background:#121214;
  border:1px solid rgba(201,168,105,.22);box-shadow:none;
}
.mark svg{width:30px;height:30px}
.eyebrow{margin-bottom:12px;color:#E2CA92;font-size:11px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}
h1{max-width:9ch;margin-bottom:16px;font-size:42px;font-weight:780;line-height:.98;letter-spacing:-.06em}
p{max-width:34ch;margin-bottom:30px;color:#B7B2A8;font-size:15px;line-height:1.6}
button{
  width:100%;min-height:52px;border:0;border-radius:15px;
  color:#0C0B09;background:#C9A869;font:700 15px/1 inherit;cursor:pointer;
  box-shadow:none;transition:transform 140ms ease,background 180ms ease;
}
button:active{transform:scale(.985)}
button:focus-visible{outline:2px solid #E2CA92;outline-offset:4px}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 64 64" fill="none"><path d="M44 16a20 20 0 1 0 0 32" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><rect x="41" y="29" width="7" height="7" rx="2" fill="currentColor"/></svg>
  </div>
  <p class="eyebrow">Connexion interrompue</p>
  <h1>Vous êtes hors ligne.</h1>
  <p>Vos données restent protégées. Reconnectez-vous pour retrouver vos achats et vos documents.</p>
  <button type="button" onclick="location.reload()">Réessayer</button>
</main>
<script>window.addEventListener('online',()=>location.reload())</script>
</body>
</html>
